- sensor:
    - name: "water_heater_last_on"
      unique_id: water_heater_last_on
      state: >
        {% set sw = states.switch.water_heater_socket_1 %}
        {% if sw is not none and sw.state == 'on' %}
          {{ ((now() - sw.last_changed).total_seconds() / 60) | round(0) }} minutes ago
        {% else %}
          off
        {% endif %}
