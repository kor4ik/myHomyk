title: "Home"
path: home
type: custom:grid-layout
layout:
  # --- Landscape tablet 1280x800 (default) ---
  grid-template-columns: 38% 62%
  grid-template-rows: auto
  grid-gap: 6px
  padding: 6px
  grid-template-areas: |
    "left right"
  mediaquery:
    # Portrait 800x1280 -> single column, stacked
    "(max-width: 900px)":
      grid-template-columns: 100%
      grid-template-rows: auto
      grid-gap: 6px
      padding: 6px
      grid-template-areas: |
        "left" 
        "right"
    # Landscape tablet / small laptop
    "(max-width: 1400px)":
      grid-template-columns: 38% 62%
      grid-template-rows: auto
      grid-gap: 6px
      padding: 6px
      grid-template-areas: |
        "left right"
cards:
  - type: vertical-stack
    cards:
      # clock & weather & camera #
      - type: custom:simple-clock-card
        use_military: true
        hide_seconds: false
        bold_clock: false
        font_size: 3.2rem
        paddingLeft_size: 16px
        paddingRight_size: 16px
        paddingTop_size: 0px
        paddingBottom_size: 0px
      - type: weather-forecast
        entity: weather.forecast_home
        name: Home
        show_current: true
        show_forecast: true
        forecast_type: daily
        forecast_slots: 4
        # secondary_info_attribute: sun.sun
      - type: "custom:button-card"
        template: custom_card_camera
        entity: !secret camera_front_door
        show_icon: true
        variables:
          ulm_custom_card_camera_title: true
          ulm_custom_card_camera_name: "Front Door"
          ulm_custom_card_camera_aspect_ratio: "16:9"
    view_layout:
      grid-area: left
  - type: vertical-stack
    cards:
      # card_person #
      # - type: horizontal-stack
      #   cards:
